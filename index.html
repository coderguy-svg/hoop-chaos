<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hoop Chaos - Random Basketball</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(#79d8ff,#dff8ff);font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
#wrap{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;padding:8px;text-align:center;background:#16324f;color:white;font-weight:bold;font-size:clamp(18px,3vw,30px)}
#menu{position:absolute;inset:0;background:linear-gradient(#16324f,#245b79);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;padding:20px;text-align:center}
button,select{font-size:18px;padding:12px 20px;border:0;border-radius:14px;background:#ffcf33;color:#172b4d;font-weight:bold;box-shadow:0 4px 0 #c39400}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c39400}
.small{font-size:14px;opacity:.9;max-width:600px}
#game{width:100%;height:100%;max-width:1100px;display:block}
#hud{position:absolute;top:48px;left:0;right:0;display:flex;justify-content:center;gap:30px;font-weight:bold;font-size:clamp(20px,4vw,36px);color:#16324f;pointer-events:none}
#controls{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 5vw;pointer-events:none}
.control{pointer-events:auto;width:110px;height:70px;border-radius:22px;background:#ffffffaa;border:3px solid #16324f;color:#16324f;font-size:17px;box-shadow:0 4px 0 #16324f}
#message{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(24px,6vw,54px);font-weight:bold;color:#16324f;text-align:center;pointer-events:none;text-shadow:2px 2px white}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
<header>🏀 HOOP CHAOS</header>
<canvas id="game"></canvas>
<div id="hud"><span id="score">0 - 0</span><span id="round">Round 1</span></div>
<div id="message"></div>
<div id="controls">
<button class="control" id="leftBtn">⬅ Move</button>
<button class="control" id="jumpBtn">⬆ Jump</button>
<button class="control" id="rightBtn">Move ➡</button>
</div>
</div>
<div id="menu">
<h1>🏀 HOOP CHAOS</h1>
<p>Random basketball action with CPU opponents!</p>
<label>Game mode<br><select id="mode"><option value="cpu">1 Player vs CPU</option><option value="local">2 Player Local</option></select></label>
<label>Category<br><select id="category"><option value="classic">Classic Basketball</option><option value="lowgravity">Low Gravity</option><option value="giantball">Giant Ball</option><option value="tinyhoops">Tiny Hoops</option><option value="chaos">Total Chaos</option><option value="night">Night Court</option></select></label>
<button id="start">START GAME</button>
<p class="small">iPad controls: use the buttons. Keyboard: A/D + W for Player 1, and arrow keys for Player 2. Score 5 points to win.</p>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,ground,mode,category,round=1,score=[0,0],ended=false,keys={},touch={left:false,right:false,jump:false};
let p1,p2,ball,hoops,particles=[],timer=0;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;ground=H-115;hoops=[{x:75,y:ground-160},{x:W-115,y:ground-160}];}
addEventListener('resize',resize);resize();
function rand(a,b){return Math.random()*(b-a)+a}
function resetRound(){
 ended=false;timer=0;document.getElementById('message').textContent='';
 let gravity=category==='lowgravity'?.22:.48;
 p1={x:W*.25,y:ground-70,vx:0,vy:0,w:34,h:68,color:'#ff5c5c',side:0,on:false,grab:false};
 p2={x:W*.75,y:ground-70,vx:0,vy:0,w:34,h:68,color:'#4e7dff',side:1,on:false,grab:false};
 ball={x:W/2,y:ground-180,vx:rand(-2,2),vy:0,r:category==='giantball'?25:category==='tinyhoops'?9:15,held:null};
}
function startGame(){mode=document.getElementById('mode').value;category=document.getElementById('category').value;round=1;score=[0,0];document.getElementById('menu').classList.add('hidden');resetRound();}
document.getElementById('start').onclick=startGame;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowleft','arrowright','arrowup',' '].includes(e.key.toLowerCase()))e.preventDefault();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function bind(id,prop){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();touch[prop]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>touch[prop]=false));}
bind('leftBtn','left');bind('rightBtn','right');bind('jumpBtn','jump');
function control(p,who){
 let left=who===0?(keys.a||touch.left):keys.arrowleft;
 let right=who===0?keys.d:keys.arrowright;
 let jump=who===0?(keys.w||touch.jump):keys.arrowup;
 p.vx+=(right?0.65:0)-(left?0.65:0);p.vx*=.88;p.x+=p.vx;
 if(jump&&p.on){p.vy=category==='lowgravity'?-10:-9;p.on=false}
 p.vy+=category==='lowgravity'?.22:.48;p.y+=p.vy;
 if(p.y+p.h/2>=ground){p.y=ground-p.h/2;p.vy=0;p.on=true}
 p.x=Math.max(20,Math.min(W-20,p.x));
}
function cpu(){
 let target=ball.x;
 if(ball.held===1)target=ball.x+30;
 let dir=target-p2.x;
 if(Math.abs(dir)>20)p2.vx+=Math.sign(dir)*.42;
 if(Math.random()<.012&&p2.on)p2.vy=-9;
}
function collide(a,b){return Math.abs(a.x-b.x)<(a.w/2+b.r)&&Math.abs(a.y-b.y)<(a.h/2+b.r)}
function update(){
 if(ended)return;
 control(p1,0);if(mode==='cpu')cpu();control(p2,1);
 if(mode==='local'){/* player two uses arrows */}
 if(ball.held!==null){
  let p=ball.held===0?p1:p2;ball.x=p.x+(p.side===0?25:-25);ball.y=p.y-30;
  let shoot=(ball.held===0?(keys.s||keys.w&&false):keys.enter);
  if((ball.held===0&&keys.s)||(ball.held===1&&keys['/'])){ball.held=null;ball.vx=p.side===0?5:-5;ball.vy=-8;}
 }else{
  ball.vy+=category==='lowgravity'?.16:.3;ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.995;
  if(ball.y+ball.r>ground){ball.y=ground-ball.r;ball.vy*=-.55;ball.vx*=.9}
  if(ball.x-ball.r<0||ball.x+ball.r>W){ball.vx*=-1;ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x))}
  if(collide(p1,ball)){ball.held=0}
  if(collide(p2,ball)){ball.held=1}
 }
 for(let i=0;i<2;i++){
  let h=hoops[i];
  if(Math.hypot(ball.x-h.x,ball.y-h.y)<28&&ball.vy>0){score[i===0?1:0]++;round++;if(score[i===0?1:0]>=5){ended=true;document.getElementById('message').textContent=(i===0?'BLUE':'RED')+' WINS!';setTimeout(()=>document.getElementById('menu').classList.remove('hidden'),1500)}else{document.getElementById('message').textContent='SCORE!';setTimeout(resetRound,700)}}
 }
 document.getElementById('score').textContent=score[0]+' - '+score[1];document.getElementById('round').textContent='Round '+round;
}
function drawPlayer(p){
 ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.max(-.45,Math.min(.45,p.vx*.04)));
 ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
 ctx.fillStyle='#ffd4a3';ctx.beginPath();ctx.arc(0,-p.h/2-14,17,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#222';ctx.fillRect(-9,-p.h/2-17,5,5);ctx.fillRect(5,-p.h/2-17,5,5);
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle=category==='night'?'#18234f':'#8fe0ff';ctx.fillRect(0,0,W,H);
 ctx.fillStyle=category==='night'?'#38446e':'#c9f4ff';ctx.fillRect(0,ground,W,H-ground);
 ctx.fillStyle='#d69a5c';ctx.fillRect(0,ground-12,W,12);
 for(let i=0;i<2;i++){let h=hoops[i];ctx.strokeStyle='#16324f';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(h.x+(i?35:-35),ground-205);ctx.lineTo(h.x+(i?35:-35),ground-80);ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(h.x-32,ground-205,64,42);ctx.strokeRect(h.x-32,ground-205,64,42);ctx.strokeStyle='#ff4b35';ctx.lineWidth=6;ctx.beginPath();ctx.arc(h.x,ground-157,22,0,Math.PI*2);ctx.stroke();}
 drawPlayer(p1);drawPlayer(p2);
 ctx.fillStyle='#f28b25';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#7d3d12';ctx.lineWidth=2;ctx.stroke();
}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
